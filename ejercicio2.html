<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF‑8">
<title>Formulario de Notas</title>
<style>
  body { font-size: 20px; margin: 30px; }
  .campo { width: 320px; padding: 10px; font-size: 20px; margin: 8px 0; }
  .boton-enviar { background-color: #2b74d9; color: white; border: none; padding: 12px 24px; font-size: 20px; border-radius: 6px; }
</style>
</head>
<body>
<h1>Formulario de Notas</h1>
<form method="post">
<p>Nota 1: <input type="number" step="0.1" name="n1" class="campo"></p>
<p>Nota 2: <input type="number" step="0.1" name="n2" class="campo"></p>
<p>Nota 3: <input type="number" step="0.1" name="n3" class="campo"></p>
<p>Asistencia (%): <input type="number" step="0.1" name="asist" class="campo"></p>
<p><button type="submit" class="boton-enviar">Enviar</button></p>
</form>
<p>{{ res }}</p>
</body>
</html>
